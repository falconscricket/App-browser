plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.quickapps.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.quickapps.launcher"
        minSdk 23
        targetSdk 34
        versionCode 6
        versionName "1.5"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // Needed for WebViewCompat.addDocumentStartJavaScript — lets us override
    // navigator.userAgentData (Client Hints) *before* WhatsApp/Discord's own
    // scripts run, which plain settings.userAgentString cannot do (see fix
    // for "Your browser doesn't support calling" in README).
    implementation 'androidx.webkit:webkit:1.12.1'
}
